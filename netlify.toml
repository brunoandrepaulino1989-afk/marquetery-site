[build]
  publish = "."

[[headers]]
  for = "/price-list-a19173cf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/prices.json"]

# Keep source files, server code and price data off the public site
[[redirects]]
  from = "/src/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
