<style>
/* Product page: gallery left, sticky details right; ambience images below; related pieces. */
.pd-top{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start;padding-block:24px 88px}
.stage{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--tile);overflow:hidden}
.stage .media{position:absolute;inset:0;aspect-ratio:auto}
.stage .media img{inset:4%;width:92%;height:92%;cursor:zoom-in}
.stage.zoom .media img{inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.6);cursor:zoom-out}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:16px;z-index:2}
.stage .nav.prev{left:16px}.stage .nav.next{right:16px}
.stage .count{position:absolute;right:16px;bottom:14px;font-size:12px;letter-spacing:.12em;font-variant-numeric:tabular-nums;background:var(--bg);padding:3px 8px;z-index:2}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px}
.thumbs button{aspect-ratio:1/1;background:var(--tile);overflow:hidden;border:1px solid transparent;position:relative}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.info{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));display:grid;gap:22px}
.info h1{font-size:clamp(42px,4.6vw,68px);line-height:1}
.info .lede{margin:0;font-size:16.5px;max-width:46ch}
.spec{grid-template-columns:minmax(110px,auto) 1fr}
.spec dd ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.info .actions{display:flex;gap:12px;flex-wrap:wrap}
.info .note{font-size:13px;color:var(--muted);margin:0}
.story{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end;padding-block:72px;border-top:1px solid var(--line)}
.story h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,3.8vw,54px);line-height:1.05;margin:0;text-wrap:balance}
.story p{margin:0;max-width:56ch;font-size:16px}
.amb{padding-bottom:96px}
.amb-head{margin-bottom:22px}
.amb-head h3{font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,40px);margin:0;letter-spacing:.02em}
.amb-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.amb-ctrl{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.amb-ctrl button{width:42px;height:42px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:15px}
.amb-ctrl button:hover{background:var(--ink);color:var(--bg)}
.reel{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.reel::-webkit-scrollbar{display:none}
.reel figure{margin:0;scroll-snap-align:start;background:var(--tile);aspect-ratio:16/9;position:relative;overflow:hidden;max-width:100%}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.reel figure.cutout img{inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:multiply}
/* Marquetry frame around the gallery: wengue edge, white-oak fillets, a 45° band of ash root and palissander, checkered corner blocks. */
.frame{--wengue:#1d1713;--palissander:#6a2c20;--ashroot:#b98a52;--ashroot-2:#cfa56d;--oak:#eadcc0;--fw:32px;
  position:relative;padding:var(--fw);
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(45deg, var(--ashroot) 0 12px, var(--wengue) 12px 14px, var(--palissander) 14px 26px, var(--oak) 26px 28px, var(--ashroot-2) 28px 40px, var(--wengue) 40px 42px);
  box-shadow:inset 0 0 0 3px var(--wengue), inset 0 0 0 5px var(--oak), inset 0 0 0 7px var(--wengue), 0 18px 40px -24px rgba(29,23,19,.55)}
.frame::after{content:"";position:absolute;inset:calc(var(--fw) - 7px);border:2px solid var(--oak);outline:3px solid var(--wengue);outline-offset:0;pointer-events:none;z-index:1}
.frame .corner{position:absolute;width:var(--fw);height:var(--fw);z-index:2;
  background:conic-gradient(var(--wengue) 0 25%, var(--oak) 0 50%, var(--wengue) 0 75%, var(--oak) 0) 0 0/50% 50%;
  box-shadow:inset 0 0 0 2px var(--wengue)}
.frame .corner::after{content:"";position:absolute;inset:28%;background:var(--palissander);transform:rotate(45deg);box-shadow:0 0 0 2px var(--oak)}
.frame .tl{top:0;left:0}.frame .tr{top:0;right:0}.frame .bl{bottom:0;left:0}.frame .br{bottom:0;right:0}
.frame .reel{position:relative;z-index:0}
@media (max-width:960px){.frame{--fw:16px}.frame::after{inset:calc(var(--fw) - 5px)}}
.reel-bar{height:1px;background:var(--line);margin-top:20px;position:relative}
.reel-bar i{position:absolute;left:0;top:0;height:1px;background:var(--ink);transition:width .4s,left .4s}
@media (prefers-reduced-motion:reduce){.reel{scroll-behavior:auto}}
.related{border-top:1px solid var(--line);padding-block:72px 96px}
.related .grid{padding-block:0}
@media (max-width:960px){
  .pd-top{grid-template-columns:1fr;gap:28px}
  .info{position:static}
  .story{grid-template-columns:1fr;gap:20px;padding-block:52px}
  .reel figure{aspect-ratio:4/5}
  .stage .nav{width:38px;height:38px}
}
</style>

<main id="view-product" hidden>
  <div class="wrap">
    <div class="crumbs" id="pd-crumbs"></div>
    <div class="pd-top">
      <div>
        <div class="stage" id="pd-stage">
          <div class="media" id="pd-media"><div class="veneer"></div><span class="veneer-label"></span><img id="pd-img" alt=""></div>
          <button class="nav prev" type="button" id="pd-prev" aria-label="Previous image">←</button>
          <button class="nav next" type="button" id="pd-next" aria-label="Next image">→</button>
          <span class="count" id="pd-count"></span>
        </div>
        <div class="thumbs" id="pd-thumbs" role="tablist" aria-label="Product images"></div>
      </div>
      <div class="info">
        <span class="eyebrow" id="pd-cat"></span>
        <h1 id="pd-name"></h1>
        <p class="lede" id="pd-desc"></p>
        <dl class="spec" id="pd-spec"></dl>
        <div class="actions">
          <button class="btn btn-solid" type="button" id="pd-enquire">Enquire about this piece</button>
          <a class="btn" href="#bespoke" id="pd-bespoke">Make it bespoke</a>
        </div>
        <p class="note">Prices on request. Every piece is made to order in Portugal and delivered white glove across the UK.</p>
      </div>
    </div>
  </div>
  <div class="wrap" id="pd-story-wrap"><section class="story" id="pd-story"></section></div>
  <div class="wrap"><section class="amb" id="pd-amb" aria-label="Gallery" aria-roledescription="carousel">
    <div class="amb-head"><h3>Gallery</h3><div class="amb-ctrl"><button type="button" id="reel-prev" aria-label="Previous image">←</button><span id="reel-count"></span><button type="button" id="reel-next" aria-label="Next image">→</button></div></div>
    <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="reel" id="reel" tabindex="0"></div>
    </div>
    <div class="reel-bar"><i id="reel-bar"></i></div>
  </section></div>
  <div class="wrap"><section class="related"><div class="head"><h3 id="pd-rel-title">You may also like</h3><a class="link" id="pd-rel-link" href="#collections">View all</a></div><div class="grid" id="pd-related" style="--cols:4"></div></section></div>
</main>

<script>
const GROUP_LABEL = {Tables:"Tables",Storage:"Storage",Seating:"Seating",Lighting:"Lighting",Complements:"Accessories"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inches = d => (d.match(/[\d.]+/g)||[]).slice(0,3).map(n=>(n/2.54).toFixed(1)).join(" × ");
function veneer(seed){
  let h=0; for (const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
  const vars=["--veneer-a","--veneer-b","--veneer-c","--veneer-d"];
  const pick=i=>`var(${vars[(h>>(i*2))&3]})`;
  return `background:conic-gradient(from ${(h%8)*45}deg at 50% 50%, ${pick(0)} 0 25%, ${pick(1)} 0 50%, ${pick(2)} 0 75%, ${pick(3)} 0), var(--tile);background-size:${60+(h%4)*20}px ${60+(h%4)*20}px`;
}
function card(p){
  const img = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('noimg')">` : "";
  return `<a class="card" href="#${esc(p.id)}"><div class="media${p.image?"":" noimg"}"><div class="veneer" style="${veneer(p.id)}"></div><span class="veneer-label">${esc(p.name.split(" ")[0])}</span>${img}<span class="tag">${esc(p.type)}</span></div><div class="caption"><h2>${esc(p.name)}</h2><span>${esc(p.dimensions.replace(/ cm$/,""))}</span></div></a>`;
}

let cur=0, imgs=[], current=null;
function show(i){
  cur=(i+imgs.length)%imgs.length;
  const m=$("pd-media"), img=$("pd-img");
  $("pd-stage").classList.remove("zoom");
  m.classList.toggle("noimg", !imgs.length);
  if(imgs.length){ img.src=imgs[cur]; img.alt=`${current.name}, image ${cur+1} of ${imgs.length}`; }
  $("pd-count").textContent = imgs.length>1 ? `${String(cur+1).padStart(2,"0")} / ${String(imgs.length).padStart(2,"0")}` : "";
  $("pd-thumbs").querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current", k===cur));
  ["pd-prev","pd-next"].forEach(id=>$(id).hidden = imgs.length<2);
}

window.renderProduct = function(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return false;
  current=p;
  const groupSlug = GROUP_LABEL[p.group].toLowerCase();
  $("pd-crumbs").innerHTML = `<a href="#home">Home</a> / <a href="#collections">Collections</a> / <a href="#${groupSlug}">${GROUP_LABEL[p.group]}</a> / ${esc(p.name)}`;
  $("pd-cat").textContent = `${GROUP_LABEL[p.group]} · ${p.type}`;
  $("pd-name").textContent = p.name;
  $("pd-desc").textContent = p.lede || p.description;
  const rows = [["Dimensions", `${p.dimensions.replace(/ cm$/,"").replace(/ x /g," × ")} cm<br><span style="color:var(--muted)">${inches(p.dimensions)} in · W × D × H</span>`]];
  if(p.materials) rows.push(["Materials", `<ul>${p.materials.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`]);
  if(p.finish) rows.push(["Finish", esc(p.finish)]);
  rows.push(["Lead time","10–12 weeks, made to order"],["Options","Veneers, finish and size can be adapted"]);
  $("pd-spec").innerHTML = rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");

  imgs = (p.gallery && p.gallery.length) ? p.gallery : (p.image ? [p.image] : []);
  const m=$("pd-media"); m.querySelector(".veneer").setAttribute("style", veneer(p.id)); m.querySelector(".veneer-label").textContent = p.name.split(" ")[0];
  $("pd-img").onerror = ()=>m.classList.add("noimg");
  $("pd-thumbs").innerHTML = imgs.length>1 ? imgs.map((src,k)=>`<button type="button" role="tab" aria-label="Image ${k+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("") : "";
  show(0);

  const story=$("pd-story");
  if(p.story){ story.innerHTML = `<h2>${esc(p.story.title)}</h2><p>${esc(p.story.text)}</p>`; $("pd-story-wrap").hidden=false; }
  else $("pd-story-wrap").hidden=true;
  const ambSrc=(p.ambience||[]).map(a=>a.src);
  const items=[...(p.ambience||[]).map(a=>({src:a.src,alt:a.alt,cut:false})), ...imgs.filter(s=>!ambSrc.includes(s)).map(s=>({src:s,alt:p.name,cut:true}))];
  $("reel").innerHTML = items.map(it=>`<figure class="${it.cut?"cutout":""}"><img src="${esc(it.src)}" alt="${esc(it.alt)}" loading="lazy"></figure>`).join("");
  $("pd-amb").hidden = items.length<2; reelN=items.length; $("reel").scrollLeft=0; setTimeout(reelUpdate,0);

  let rel = PRODUCTS.filter(x=>x.id!==p.id && x.type===p.type);
  if(rel.length<4) rel = rel.concat(PRODUCTS.filter(x=>x.id!==p.id && x.group===p.group && x.type!==p.type)).slice(0,4);
  $("pd-related").innerHTML = rel.slice(0,4).map(card).join("");
  $("pd-rel-link").href = "#"+groupSlug; $("pd-rel-link").textContent = "All "+GROUP_LABEL[p.group].toLowerCase();
  document.title = `${p.name} · Marquetery`;
  return true;
};

let reelN=0;
const reelIdx=()=>{ const r=$("reel"); return r.clientWidth ? Math.round(r.scrollLeft/r.clientWidth) : 0; };
function reelGo(i){ const r=$("reel"); i=(i+reelN)%reelN; r.scrollTo({left:i*r.clientWidth}); }
function reelUpdate(){ if(!reelN) return; const i=reelIdx(); $("reel-count").textContent=`${String(i+1).padStart(2,"0")} / ${String(reelN).padStart(2,"0")}`; const b=$("reel-bar"); b.style.width=(100/reelN)+"%"; b.style.left=(100*i/reelN)+"%"; }
$("reel-prev").onclick=()=>reelGo(reelIdx()-1);
$("reel-next").onclick=()=>reelGo(reelIdx()+1);
$("reel").addEventListener("scroll",()=>requestAnimationFrame(reelUpdate),{passive:true});
window.addEventListener("resize",reelUpdate);

$("pd-prev").onclick=()=>show(cur-1);
$("pd-next").onclick=()=>show(cur+1);
$("pd-thumbs").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show([...b.parentNode.children].indexOf(b));});
$("pd-img").addEventListener("click",()=>$("pd-stage").classList.toggle("zoom"));
document.addEventListener("keydown",e=>{ if($("view-product").hidden) return; if(e.key==="ArrowLeft") show(cur-1); if(e.key==="ArrowRight") show(cur+1); });
let tx=null; $("pd-stage").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("pd-stage").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) show(cur+(dx<0?1:-1)); tx=null; });
$("pd-enquire").onclick=()=>{ $("contact").scrollIntoView({behavior:"smooth"}); setTimeout(()=>$("email").focus({preventScroll:true}),600); };
</script>
