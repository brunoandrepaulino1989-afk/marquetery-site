<style>
/* Projects: intro + masonry gallery of workshop photographs, with a lightbox. */
.pj-intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end;padding-block:28px 56px;border-bottom:1px solid var(--line)}
.pj-intro h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,6vw,96px);line-height:.95;margin:0;letter-spacing:.02em}
.pj-intro p{margin:0;max-width:56ch;font-size:16px}
.pj-grid{columns:3 320px;column-gap:16px;padding-block:48px 96px}
.pj-grid figure{break-inside:avoid;margin:0 0 16px;display:block}
.pj-grid button{display:block;width:100%;padding:0;background:var(--tile);overflow:hidden;cursor:zoom-in}
.pj-grid img{display:block;width:100%;height:auto;transition:transform .6s ease}
.pj-grid button:hover img{transform:scale(1.02)}
.pj-grid figcaption{font-size:12.5px;color:var(--muted);letter-spacing:.02em;padding:8px 2px 0}
.pj-box{position:fixed;inset:0;z-index:60;background:rgba(17,16,16,.94);display:grid;grid-template-rows:1fr auto;place-items:center;padding:56px 72px 24px}
.pj-box[hidden]{display:none}
.pj-box img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain}
.pj-box p{color:#f0eee9;font-size:13px;letter-spacing:.04em;margin:14px 0 0;text-align:center}
.pj-box button{position:absolute;color:#f0eee9;width:48px;height:48px;display:grid;place-items:center;font-size:20px;border-radius:50%;border:1px solid rgba(240,238,233,.35)}
.pj-box button:hover{background:rgba(240,238,233,.1)}
.pj-box .x{top:16px;right:16px}
.pj-box .pv{left:16px;top:50%;transform:translateY(-50%)}
.pj-box .nx{right:16px;top:50%;transform:translateY(-50%)}
@media (max-width:860px){.pj-intro{grid-template-columns:1fr;gap:16px;padding-bottom:36px}.pj-grid{columns:2 160px;column-gap:10px}.pj-grid figure{margin-bottom:10px}.pj-box{padding:64px 12px 20px}.pj-box .pv,.pj-box .nx{top:auto;bottom:16px;transform:none}}
</style>
<main id="view-projects" hidden>
  <div class="wrap">
    <div class="crumbs"><a href="#home">Home</a> / Projects</div>
    <section class="pj-intro">
      <h1>Projects</h1>
      <p>Pieces from our workshop in Portugal, photographed as they were finished and before they left for their new homes. Each one was made to order, many in veneers and sizes chosen by the client.</p>
    </section>
    <div class="pj-grid" id="pj-grid"></div>
  </div>
</main>
<div class="pj-box" id="pj-box" hidden role="dialog" aria-modal="true" aria-label="Project photo">
  <img id="pj-img" alt="">
  <p id="pj-cap"></p>
  <button class="x" type="button" id="pj-x" aria-label="Close">✕</button>
  <button class="pv" type="button" id="pj-pv" aria-label="Previous photo">←</button>
  <button class="nx" type="button" id="pj-nx" aria-label="Next photo">→</button>
</div>
<script>
const PJ = [
  ["coffee-1","Round centre table in burr woods, ivory and black"],
  ["oval-1","Oval dining table in pearl-white veneer on two sculpted pedestals"],
  ["dressing-1","Dressing table in walnut, ivory lacquer and polished brass"],
  ["line-1","Round centre table with hand-drawn inlay in ivory and navy"],
  ["bedside-1","A pair of round bedside tables in bird's-eye and ebony"],
  ["miro-1","Round centre table in blue, red and maple inlay"],
  ["faceted-1","Faceted side table in bird's-eye with blue-dyed inlay"],
  ["console-1","Console table in walnut burl, maple and poplar burl with brass bands"],
  ["top-1","A marquetry top in the workshop, before lacquering"],
  ["stacked-1","Stacked bedside tables in bird's-eye and palisander"],
  ["coffee-2","Round centre table, seen from above"],
  ["oval-2","The oval top, inlaid with polished steel discs"],
  ["dressing-2","Dressing table with nickel details"],
  ["line-2","The navy and ivory top, seen from the side"],
  ["bedside-2","Round bedside table, drawer open"],
  ["miro-2","Blue inlaid centre table with striped apron"],
  ["faceted-3","Faceted side table in blue-dyed veneer"],
  ["top-2","Burr woods and ebony, cut and laid by hand"],
  ["stacked-2","Stacked bedside tables with hand-drawn inlay"],
  ["coffee-3","Round centre table on two legs"],
  ["oval-3","Two pedestals: fluted ivory column and striped sphere"],
  ["dressing-3","Mirror stand in polished nickel"],
  ["line-3","The inlaid top, cut and laid before lacquering"],
  ["bedside-3","Bedside tables in bird's-eye, burr and ebony"],
  ["miro-3","The blue top, seen from the front"],
  ["faceted-4","Faceted side table, the top face"],
  ["coffee-4","Round centre table, leg detail"],
  ["oval-4","Steel inlays set into the pearl-white top"],
  ["line-4","Lacquering the striped apron in the spray booth"],
  ["bedside-4","Bedside tables before wrapping"],
  ["miro-4","Blue inlaid centre table, three-quarter view"],
  ["faceted-2","Faceted side table in bird's-eye"],
  ["oval-5","Oval dining table, end view"],
  ["line-5","Fresh lacquer on the inlaid top"],
  ["bedside-5","Bedside tables, drawers open"],
  ["oval-6","The striped sphere pedestal on its ivory cone"],
  ["line-6","The top polished to a high gloss"],
  ["oval-7","Pedestal detail, fluted ivory and black lacquer"],
  ["oval-8","Ribbed black apron under the top"],
  ["oval-9","The top in the workshop, before finishing"],
];
const pjSrc = n => "images/projects/"+n+".webp";
document.getElementById("pj-grid").innerHTML = PJ.map(([n,c],i)=>`<figure><button type="button" data-i="${i}" aria-label="Open photo: ${c}"><img src="${pjSrc(n)}" alt="${c}" loading="lazy"></button><figcaption>${c}</figcaption></figure>`).join("");
let pjI=0, pjLast=null;
const box=document.getElementById("pj-box"), bimg=document.getElementById("pj-img"), bcap=document.getElementById("pj-cap");
function pjShow(i){ pjI=(i+PJ.length)%PJ.length; bimg.src=pjSrc(PJ[pjI][0]); bimg.alt=PJ[pjI][1]; bcap.textContent=PJ[pjI][1]; }
function pjOpen(i){ pjLast=document.activeElement; pjShow(i); box.hidden=false; document.body.style.overflow="hidden"; document.getElementById("pj-x").focus(); }
function pjClose(){ box.hidden=true; document.body.style.overflow=""; if(pjLast) pjLast.focus(); }
document.getElementById("pj-grid").addEventListener("click",e=>{const b=e.target.closest("button[data-i]"); if(b) pjOpen(+b.dataset.i);});
document.getElementById("pj-x").addEventListener("click",pjClose);
document.getElementById("pj-pv").addEventListener("click",()=>pjShow(pjI-1));
document.getElementById("pj-nx").addEventListener("click",()=>pjShow(pjI+1));
box.addEventListener("click",e=>{ if(e.target===box) pjClose(); });
document.addEventListener("keydown",e=>{ if(box.hidden) return; if(e.key==="Escape") pjClose(); if(e.key==="ArrowLeft") pjShow(pjI-1); if(e.key==="ArrowRight") pjShow(pjI+1); });
</script>
